add_event:
  name: Dodaj wydarzenie
  description: Zapisz wydarzenie w e-Calendar. Początek i koniec są dostępne dla automatyzacji HA. Powtarzanie zachowuje długość wydarzenia.
  fields:
    entity_id:
      name: Kalendarz
      required: true
      selector:
        entity:
          filter:
            - integration: ecalendar
              domain: calendar
    name:
      name: Nazwa wydarzenia
      required: true
      selector:
        text:
    date:
      name: Data początkowa
      required: true
      selector:
        date:
    time:
      name: Godzina (opcjonalnie)
      description: Pomiń dla wydarzenia całodniowego. Sekundy muszą wynosić zero.
      selector:
        time:
    end_date:
      name: Koniec — data (opcjonalnie)
      description: Puste pole oznacza ten sam dzień. Dla wydarzenia całodniowego wybierz ostatni dzień włącznie. Maksymalna różnica dat to 366 dni.
      selector:
        date:
    end_time:
      name: Koniec — godzina (opcjonalnie)
      description: Dla wydarzenia godzinowego podaj obie godziny. Koniec musi być późniejszy niż początek.
      selector:
        time:
    advance_days:
      name: Wyświetlaj wcześniej
      default: "0"
      selector:
        select:
          options:
            - {value: "0", label: W dniu wydarzenia}
            - {value: "1", label: 1 dzień wcześniej}
            - {value: "2", label: 2 dni wcześniej}
            - {value: "3", label: 3 dni wcześniej}
            - {value: "5", label: 5 dni wcześniej}
            - {value: "7", label: 7 dni wcześniej}
    repeat:
      name: Powtarzanie
      default: "0"
      selector:
        select:
          options:
            - {value: "0", label: Jednorazowo}
            - {value: "1", label: Co tydzień}
            - {value: "2", label: Co miesiąc}
            - {value: "3", label: Co rok}
            - {value: "4", label: Wybrany dzień tygodnia w miesiącu}
    short_month_last_day:
      name: W krótszych miesiącach przypominaj w ostatnim dniu miesiąca
      description: Tylko dla powtarzania co miesiąc lub co rok. Oryginalna data pozostaje bez zmian.
      default: false
      selector:
        boolean:
    monthly_occurrence:
      name: Który dzień w miesiącu
      description: Tylko dla reguły miesięcznej.
      default: "1"
      selector:
        select:
          options:
            - {value: "1", label: Pierwszy}
            - {value: "2", label: Drugi}
            - {value: "3", label: Trzeci}
            - {value: "4", label: Czwarty}
            - {value: "5", label: Ostatni}
    monthly_weekday:
      name: Dzień tygodnia
      default: "1"
      selector:
        select:
          options:
            - {value: "1", label: Poniedziałek}
            - {value: "2", label: Wtorek}
            - {value: "3", label: Środa}
            - {value: "4", label: Czwartek}
            - {value: "5", label: Piątek}
            - {value: "6", label: Sobota}
            - {value: "0", label: Niedziela}
    anniversary:
      name: Obliczaj wiek lub rocznicę
      description: Wymaga powtarzania co rok.
      selector:
        boolean:
    anniversary_base:
      name: Wiek lub numer rocznicy w roku początkowym
      selector:
        number:
          min: 0
          max: 250
          step: 1
          mode: box
delete_event:
  name: Usuń wydarzenie
  description: Usuwa cały wpis, także całą serię cykliczną. Najwygodniejsze usuwanie jest w panelu e-Calendar.
  fields:
    entity_id:
      name: Kalendarz
      required: true
      selector:
        entity:
          filter:
            - integration: ecalendar
              domain: calendar
    event_id:
      name: Identyfikator wydarzenia
      description: Atrybut event_id encji Najbliższe wydarzenie lub identyfikator z stored_events encji Kalendarz.
      required: true
      selector:
        text:
refresh_events:
  name: Pobierz wydarzenia
  description: Pobiera aktualną listę z urządzenia; nie odświeża fizycznego ekranu.
  fields:
    entity_id:
      name: Kalendarz
      required: true
      selector:
        entity:
          filter:
            - integration: ecalendar
              domain: calendar
